name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
    # A request-file push selects the documented default patch bump.
    paths: [.github/release-request.json]
  workflow_dispatch:
    inputs:
      bump:
        description: Publish the current version, bump it, or retry an existing tag
        required: true
        type: choice
        default: current
        options: [current, patch, minor, major, existing]
      tag:
        description: For "existing" only, enter the already-created tag (vX.Y.Z)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: z58-crates-io-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'LIghtJUNction/z58' && github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true # Only the version/tag creation job may push
      - name: Select and create the version tag
        id: version
        env:
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
          EXISTING_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          if [ "$RELEASE_BUMP" = existing ]; then
            if [ -z "$EXISTING_TAG" ]; then
              echo 'Select an existing vX.Y.Z tag to retry.' >&2
              exit 1
            fi
            python3 scripts/release.py resolve --tag "$EXISTING_TAG"
            tag="$EXISTING_TAG"
            commit="$(git rev-parse "refs/tags/$tag^{commit}")"
          else
            if [ -n "$EXISTING_TAG" ]; then
              echo 'The tag field is only used with the existing choice.' >&2
              exit 1
            fi
            tag="$(python3 scripts/bump_version.py --mode "$RELEASE_BUMP")"
            python3 scripts/release.py unpublished --tag "$tag"
            if git show-ref --verify --quiet "refs/tags/$tag"; then
              echo "Tag $tag already exists; select existing to retry it." >&2
              exit 1
            fi
            if [ "$RELEASE_BUMP" != current ]; then
              git add -- Cargo.toml Cargo.lock comparison/Cargo.lock
              git -c user.name='github-actions[bot]' \
                  -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
                  commit -m "chore(release): $tag"
              git push origin HEAD:refs/heads/main
            fi
            commit="$(git rev-parse HEAD)"
            git tag "$tag" "$commit"
            git push origin "refs/tags/$tag"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  resolve:
    needs: prepare
    if: always() && github.repository == 'LIghtJUNction/z58' && (github.event_name == 'push' || needs.prepare.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.commit || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing tag and check its package version
        id: identity
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag || github.ref_name }}
          RELEASE_COMMIT: ${{ needs.prepare.outputs.commit || github.sha }}
        run: |
          python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      checksum: ${{ steps.published.outputs.checksum }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Recheck tag and immutable registry version
        run: |
          python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          python3 scripts/release.py unpublished --tag "$RELEASE_TAG"
      - name: Check published file list and dependency boundary
        run: python3 scripts/check_package.py
      - name: Package the checked commit
        run: cargo +stable package --locked
      - name: Dry-run publication
        run: cargo +stable publish --dry-run --locked
      - name: Verify archive provenance
        run: python3 scripts/release.py archive --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Missing repository secret CARGO_REGISTRY_TOKEN; publication stopped.' >&2
            exit 1
          fi
          cargo +stable publish --locked
      - name: Confirm registry checksum before releasing
        id: published
        run: |
          checksum=$(python3 scripts/release.py archive --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" | sed -n 's/^checksum=//p')
          python3 scripts/release.py published --tag "$RELEASE_TAG" --checksum "$checksum" --wait 180
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_CHECKSUM: ${{ needs.publish.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck published package identity
        run: |
          python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          python3 scripts/release.py published --tag "$RELEASE_TAG" --checksum "$RELEASE_CHECKSUM"
      - name: Create GitHub Release after crates.io confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          commit = os.environ['RELEASE_COMMIT']
          checksum = os.environ['RELEASE_CHECKSUM']
          Path('release-notes.md').write_text(
              f'Published [z58 {version}](https://crates.io/crates/z58/{version}) to crates.io.\n\n'
              f'Checked commit: `{commit}`\n\nPackage SHA-256: `{checksum}`\n'
          )
          PY
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" --notes-file release-notes.md
