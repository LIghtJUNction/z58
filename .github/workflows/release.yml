name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (vX.Y.Z); branches and new tags are rejected
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: z58-crates-io-release
  cancel-in-progress: false

jobs:
  resolve:
    if: github.repository == 'LIghtJUNction/z58'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      tag: ${{ steps.identity.outputs.tag }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve an existing tag and check its package version
        id: identity
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          EVENT_COMMIT: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = push ]; then
            python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$EVENT_COMMIT"
          else
            python3 scripts/release.py resolve --tag "$RELEASE_TAG"
          fi

  validate:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ needs.resolve.outputs.commit }}

  publish:
    needs: [resolve, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      checksum: ${{ steps.published.outputs.checksum }}
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Recheck tag and immutable registry version
        run: |
          python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          python3 scripts/release.py unpublished --tag "$RELEASE_TAG"
      - name: Check published file list and dependency boundary
        run: python3 scripts/check_package.py
      - name: Package the checked commit
        run: cargo +stable package --locked
      - name: Dry-run publication
        run: cargo +stable publish --dry-run --locked
      - name: Verify archive provenance
        run: python3 scripts/release.py archive --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo 'Missing repository secret CARGO_REGISTRY_TOKEN; publication stopped.' >&2
            exit 1
          fi
          cargo +stable publish --locked
      - name: Confirm registry checksum before releasing
        id: published
        run: |
          checksum=$(python3 scripts/release.py archive --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT" | sed -n 's/^checksum=//p')
          python3 scripts/release.py published --tag "$RELEASE_TAG" --checksum "$checksum" --wait 180
          echo "checksum=$checksum" >> "$GITHUB_OUTPUT"

  github-release:
    needs: [resolve, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.resolve.outputs.tag }}
      RELEASE_VERSION: ${{ needs.resolve.outputs.version }}
      RELEASE_COMMIT: ${{ needs.resolve.outputs.commit }}
      RELEASE_CHECKSUM: ${{ needs.publish.outputs.checksum }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit }}
          fetch-depth: 0
          persist-credentials: false
      - name: Recheck published package identity
        run: |
          python3 scripts/release.py resolve --tag "$RELEASE_TAG" --commit "$RELEASE_COMMIT"
          python3 scripts/release.py published --tag "$RELEASE_TAG" --checksum "$RELEASE_CHECKSUM"
      - name: Create GitHub Release after crates.io confirmation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          version = os.environ['RELEASE_VERSION']
          commit = os.environ['RELEASE_COMMIT']
          checksum = os.environ['RELEASE_CHECKSUM']
          Path('release-notes.md').write_text(
              f'Published [z58 {version}](https://crates.io/crates/z58/{version}) to crates.io.\n\n'
              f'Checked commit: `{commit}`\n\nPackage SHA-256: `{checksum}`\n'
          )
          PY
          gh release create "$RELEASE_TAG" --verify-tag --target "$RELEASE_COMMIT" \
            --title "$RELEASE_TAG" --notes-file release-notes.md
