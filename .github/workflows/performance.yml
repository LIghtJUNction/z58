name: Fixed-hardware performance acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: z58-fixed-hardware
  cancel-in-progress: false

jobs:
  performance:
    if: github.repository == 'LIghtJUNction/z58' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, z58-benchmark]
    timeout-minutes: 30
    env:
      EXPECTED_CPU: ${{ vars.Z58_BENCH_CPU }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the configured measurement hardware
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['lscpu', '-J']))['lscpu']
          actual = next(row['data'] for row in data if row['field'] == 'Model name:')
          expected = os.environ['EXPECTED_CPU']
          if not expected or actual != expected:
              raise SystemExit(f'CPU mismatch: actual={actual!r}, configured={expected!r}')
          print(f'Fixed benchmark CPU: {actual}')
          PY
      - run: rustup toolchain install stable --profile minimal
      - name: Portable full benchmark
        run: cargo +stable run --release --locked --manifest-path comparison/Cargo.toml -- --output comparison/results/portable
      - name: Native full benchmark
        env:
          RUSTFLAGS: -C target-cpu=native
        run: cargo +stable run --release --locked --manifest-path comparison/Cargo.toml -- --output comparison/results/native
      - name: Evaluate the predeclared 2x target
        run: python3 scripts/performance_gate.py comparison/results/native/raw.csv --output comparison/results/native/gate.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fixed-hardware-${{ github.sha }}
          path: comparison/results/
          if-no-files-found: error
          retention-days: 90
