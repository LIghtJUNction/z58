[package]
name = "z58"
version = "0.1.3"
edition = "2024"
rust-version = "1.99.1"
description = "Zero-dependency, allocation-free Bitcoin Base58 with fixed-size fast paths"
license = "MIT"
repository = "https://github.com/LIghtJUNction/z58"
keywords = ["base58", "no-std", "encoding", "bitcoin"]
categories = ["encoding", "no-std::no-alloc"]
include = ["src/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "docs/algorithm.md", "docs/fixed-kernel.md"]

[workspace]
members = ["."]
exclude = ["comparison"]
resolver = "3"

[dependencies]

[dev-dependencies]

[build-dependencies]
