[package]
name = "z58-comparison"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[workspace]
resolver = "3"

[dependencies]
z58 = { path = ".." }
bs58 = { version = "=0.5.1", default-features = false }
five8 = "=1.0.0"
fd_bs58 = "=0.1.0"
braid58 = "=0.1.0"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

[profile.dev]
debug = 0
